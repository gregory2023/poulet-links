<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Poulet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Poulet — transporte en Villanueva de la Cañada. Reserva por WhatsApp.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#22c55e;
    --green-dark:#16a34a;
    --bg1:#eafbe9;
    --bg2:#f4f5f7;
    --text:#1c1f26;
    --muted:#5b616b;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Nunito',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:linear-gradient(135deg,var(--bg1),var(--bg2),#dcf8e0,var(--bg2));
    background-size:300% 300%;
    animation:gradientMove 14s ease infinite;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 32px;
  }
  @keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .avatar{
    font-size:64px;
    width:112px;
    height:112px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--card);
    border-radius:50%;
    box-shadow:0 8px 24px rgba(34,197,94,.25);
    animation:float 3.2s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-10px) rotate(-4deg);}
  }
  h1{
    margin:18px 0 2px;
    font-size:26px;
    font-weight:800;
    letter-spacing:.01em;
  }
  .tag{
    color:var(--muted);
    font-size:14.5px;
    margin:0 0 30px;
    text-align:center;
  }
  .links{
    width:100%;
    max-width:380px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .link{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border-radius:16px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--text);
    font-weight:700;
    font-size:15.5px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    border:1px solid rgba(0,0,0,.04);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    opacity:0;
    transform:translateY(10px);
    animation:fadeUp .5s ease forwards;
  }
  .link:nth-of-type(1){animation-delay:.05s;}
  .link:nth-of-type(2){animation-delay:.15s;}
  @keyframes fadeUp{
    to{opacity:1;transform:translateY(0);}
  }
  .link:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 22px rgba(34,197,94,.22);
  }
  .link:active{transform:translateY(0) scale(.98);}
  .link.primary{
    background:var(--green);
    color:#fff;
    box-shadow:0 6px 18px rgba(34,197,94,.35);
  }
  .link.primary:hover{background:var(--green-dark);}
  .icon{font-size:22px;flex:0 0 auto;}
  .label{flex:1;}
  .arrow{opacity:.55;font-size:14px;}
  footer{
    margin-top:auto;
    padding-top:40px;
    color:var(--muted);
    font-size:12px;
    text-align:center;
  }
  footer a{color:var(--muted);text-decoration:none;}

  @media (prefers-color-scheme: dark){
    :root{
      --bg1:#0f1a12;
      --bg2:#14181d;
      --text:#eef1f4;
      --muted:#9aa1ab;
      --card:#1b2029;
    }
    .link{border-color:rgba(255,255,255,.06);}
  }
</style>
</head>
<body>

  <div class="avatar">🐥</div>
  <h1>Poulet</h1>
  <p class="tag">Transporte en Villanueva de la Cañada</p>

  <div class="links">
    <a class="link primary" href="https://wa.me/34643637870" target="_blank" rel="noopener">
      <span class="icon">💬</span>
      <span class="label">Reservar por WhatsApp</span>
      <span class="arrow">↗</span>
    </a>
    <a class="link" href="precios.pdf" target="_blank" rel="noopener">
      <span class="icon">📄</span>
      <span class="label">Ver tarifas</span>
      <span class="arrow">↗</span>
    </a>
  </div>

  <footer>🐥 Poulet</footer>

</body>
</html>
